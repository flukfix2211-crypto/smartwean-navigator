// ============ Haversine Distance (km) ============
const haversineDistance = (lat1, lng1, lat2, lng2) => {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
};

const AppContext = createContext();

const AppProvider = ({ children }) => {
  const [lang, setLang] = useState(localStorage.getItem('lang') || 'th');
  const [user, setUser] = useState(() => {
    const saved = localStorage.getItem('user');
    return saved ? JSON.parse(saved) : null;
  });
  const [patients, setPatients] = useState(() => generatePatients());
  const [alerts, setAlerts] = useState([]);
  const [toasts, setToasts] = useState([]);
  const [page, setPage] = useState('dashboard');
  const [selectedPatientId, setSelectedPatientId] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const t = useCallback((key) => translations[lang][key] || key, [lang]);

  const changeLang = (newLang) => {
    setLang(newLang);
    localStorage.setItem('lang', newLang);
  };

  const login = (email, password) => {
    if ((email === 'admin@hospital.com' && password === 'admin123') ||
        (email === 'nurse@hospital.com' && password === 'nurse123')) {
      const u = {
        id: 'U001',
        name: email.includes('admin') ? 'Admin โรงพยาบาล' : 'พยาบาลสมหญิง',
        email,
        role: email.includes('admin') ? 'admin' : 'nurse'
      };
      setUser(u);
      localStorage.setItem('user', JSON.stringify(u));
      return u;
    }
    throw new Error(lang === 'th' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : 'Invalid credentials');
  };

  const logout = () => {
    setUser(null);
    localStorage.removeItem('user');
    setPage('dashboard');
  };

  const addToast = (message, type = 'info') => {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
  };

  const addAlert = (alert) => {
    const newAlert = { ...alert, id: 'A' + Date.now(), createdAt: new Date(), acknowledged: false };
    setAlerts(prev => [newAlert, ...prev].slice(0, 50));
    addToast(alert.message, alert.severity);
  };

  const acknowledgeAlert = (id) => {
    setAlerts(prev => prev.map(a => a.id === id ? { ...a, acknowledged: true } : a));
  };

  // Real-time simulation
  useEffect(() => {
    if (!user) return;

    const vitalsInterval = setInterval(() => {
      setPatients(prev => prev.map(p => {
        if (p.status === 'discharged') return p;
        const last = p.vitals[p.vitals.length - 1];
        const newVital = {
          heartRate: Math.max(40, Math.min(140, last.heartRate + (Math.random() - 0.5) * 6)),
          systolicBP: Math.max(80, Math.min(180, last.systolicBP + (Math.random() - 0.5) * 5)),
          diastolicBP: Math.max(50, Math.min(110, last.diastolicBP + (Math.random() - 0.5) * 3)),
          spo2: Math.max(85, Math.min(100, last.spo2 + (Math.random() - 0.5) * 1)),
          temperature: +Math.max(35, Math.min(40, last.temperature + (Math.random() - 0.5) * 0.2)).toFixed(1),
          recordedAt: new Date()
        };

        let newStatus = 'stable';
        if (newVital.heartRate > 120 || newVital.heartRate < 50 || newVital.spo2 < 92) {
          newStatus = newVital.heartRate > 140 || newVital.spo2 < 88 ? 'critical' : 'warning';
        }

        if (Math.random() < 0.003) {
          const types = ['vital_sign', 'geofence', 'inactive'];
          const type = types[Math.floor(Math.random() * types.length)];
          const messages = {
            th: {
              vital_sign: `สัญญาณชีพผิดปกติ: ${p.name} (HR: ${Math.round(newVital.heartRate)}, SpO2: ${Math.round(newVital.spo2)})`,
              geofence: `ผู้ป่วย ${p.name} ออกจากพื้นที่ที่กำหนด`,
              inactive: `ไม่ได้รับตำแหน่งจาก ${p.name} นานกว่า 15 นาที`
            },
            en: {
              vital_sign: `Abnormal vitals: ${p.name} (HR: ${Math.round(newVital.heartRate)}, SpO2: ${Math.round(newVital.spo2)})`,
              geofence: `Patient ${p.name} left the designated area`,
              inactive: `No location update from ${p.name} for 15+ minutes`
            }
          };
          addAlert({
            patientId: p.id,
            patientName: p.name,
            type,
            severity: type === 'geofence' ? 'critical' : newStatus === 'critical' ? 'critical' : 'warning',
            message: messages[lang][type]
          });
        }

        const newLoc = {
          lat: p.location.lat + (Math.random() - 0.5) * 0.0003,
          lng: p.location.lng + (Math.random() - 0.5) * 0.0003,
          updatedAt: new Date()
        };

        return {
          ...p,
          vitals: [...p.vitals.slice(-95), newVital],
          location: newLoc,
          status: newStatus
        };
      }));
    }, 5000);

    return () => clearInterval(vitalsInterval);
  }, [user, lang]);

  const value = {
    lang, t, changeLang,
    user, login, logout,
    patients, setPatients,
    alerts, addAlert, acknowledgeAlert,
    toasts, addToast,
    page, setPage,
    selectedPatientId, setSelectedPatientId,
    sidebarOpen, setSidebarOpen
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
};

// ============ Map ============
const MapView = ({ patients, center, zoom = 13, height = '100%', showHomeMarkers = false, showHospitalMarkers = false, hospitals = [] }) => {
  const mapRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const markersRef = useRef({});
  const circlesRef = useRef({});
  const homeMarkersRef = useRef({});
  const hospMarkersRef = useRef({});

  const statusColors = { stable: '#10b981', warning: '#f59e0b', critical: '#ef4444' };

  useEffect(() => {
    if (!mapRef.current || mapInstanceRef.current) return;
    const c = center || [13.7563, 100.5018];
    mapInstanceRef.current = L.map(mapRef.current).setView(c, zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(mapInstanceRef.current);

    setTimeout(() => mapInstanceRef.current.invalidateSize(), 100);

    return () => {
      if (mapInstanceRef.current) {
        mapInstanceRef.current.remove();
        mapInstanceRef.current = null;
      }
    };
  }, []);

  // In-hospital patient markers (pulsing dots) — only when NOT in home mode
  useEffect(() => {
    if (!mapInstanceRef.current || showHomeMarkers) return;
    const map = mapInstanceRef.current;

    // Remove home/hospital markers if switching modes
    Object.values(homeMarkersRef.current).forEach(m => m.remove());
    homeMarkersRef.current = {};
    Object.values(hospMarkersRef.current).forEach(m => m.remove());
    hospMarkersRef.current = {};

    patients.forEach(p => {
      if (!p.location) return;
      const color = statusColors[p.status] || '#ec4899';

      if (p.geofence?.center && !circlesRef.current[p.id]) {
        const circle = L.circle([p.geofence.center.lat, p.geofence.center.lng], {
          radius: p.geofence.radius,
          color: '#ec4899',
          fillColor: '#ec4899',
          fillOpacity: 0.05,
          weight: 1,
          dashArray: '5, 5'
        }).addTo(map);
        circlesRef.current[p.id] = circle;
      }

      const icon = L.divIcon({
        className: 'custom-marker',
        html: `<div style="position:relative;width:24px;height:24px;">
          <div class="pulse-ring" style="color:${color};width:24px;height:24px;"></div>
          <div style="position:absolute;inset:0;background:${color};border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>
        </div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      if (markersRef.current[p.id]) {
        markersRef.current[p.id].setLatLng([p.location.lat, p.location.lng]);
        markersRef.current[p.id].setIcon(icon);
      } else {
        const marker = L.marker([p.location.lat, p.location.lng], { icon })
          .bindPopup(`<div style="font-family:Prompt,sans-serif;"><strong>${p.name}</strong><br/>Room: ${p.room}-${p.bed}<br/>Status: <span style="color:${color};font-weight:600;">${p.status}</span></div>`)
          .addTo(map);
        markersRef.current[p.id] = marker;
      }
    });
  }, [patients, showHomeMarkers]);

  // Home markers mode
  useEffect(() => {
    if (!mapInstanceRef.current || !showHomeMarkers) return;
    const map = mapInstanceRef.current;

    // Remove in-hospital markers
    Object.values(markersRef.current).forEach(m => m.remove());
    markersRef.current = {};
    Object.values(circlesRef.current).forEach(m => m.remove());
    circlesRef.current = {};

    // Draw home markers
    patients.forEach(p => {
      if (!p.homeAddress) return;
      const color = statusColors[p.status] || '#10b981';
      const homeIcon = L.divIcon({
        className: '',
        html: `<div style="position:relative;text-align:center;">
          <div style="font-size:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35));line-height:1;">${p.status === 'critical' ? '🔴' : p.status === 'warning' ? '🟡' : '🏠'}</div>
        </div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 28]
      });

      if (homeMarkersRef.current[p.id]) {
        // already placed, skip
      } else {
        const marker = L.marker([p.homeAddress.lat, p.homeAddress.lng], { icon: homeIcon })
          .bindPopup(`<div style="font-family:Prompt,sans-serif;min-width:160px;">
            <strong>${p.name}</strong><br/>
            <span style="color:#6b7280;font-size:12px;">เขต${p.homeAddress.district}</span><br/>
            <span style="color:${color};font-weight:600;font-size:12px;">${p.status === 'critical' ? '🔴 วิกฤต' : p.status === 'warning' ? '🟡 เฝ้าระวัง' : '🟢 ปกติ'}</span>
          </div>`)
          .addTo(map);
        homeMarkersRef.current[p.id] = marker;
      }
    });

    // Draw hospital markers
    if (showHospitalMarkers) {
      const hospsToShow = hospitals.length > 0 ? hospitals : HOSPITALS;
      hospsToShow.forEach(h => {
        if (hospMarkersRef.current[h.id]) return;
        const hospIcon = L.divIcon({
          className: '',
          html: `<div style="background:#0ea5e9;border:2.5px solid white;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,0.3);">🏥</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 28]
        });
        const marker = L.marker([h.lat, h.lng], { icon: hospIcon })
          .bindPopup(`<div style="font-family:Prompt,sans-serif;min-width:160px;">
            <strong>${h.name}</strong><br/>
            <span style="color:#6b7280;font-size:12px;">${h.specialty}</span><br/>
            <span style="color:#0ea5e9;font-size:12px;">📞 ${h.phone}</span>
          </div>`)
          .addTo(map);
        hospMarkersRef.current[h.id] = marker;
      });
    }
  }, [patients, showHomeMarkers, showHospitalMarkers, hospitals]);

  useEffect(() => {
    if (mapInstanceRef.current && center) {
      mapInstanceRef.current.setView(center, zoom);
    }
  }, [center, zoom]);

  return <div ref={mapRef} style={{ height, width: '100%' }} />;
};

// ============ Vital Chart ============
const VitalChart = ({ vitals, metric = 'all' }) => {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || vitals.length === 0) return;

    const labels = vitals.map(v => {
      const d = new Date(v.recordedAt);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    });

    const datasets = [];
    if (metric === 'all' || metric === 'hr') {
      datasets.push({
        label: 'HR (bpm)', data: vitals.map(v => v.heartRate),
        borderColor: '#ec4899', backgroundColor: 'rgba(236, 72, 153, 0.1)',
        tension: 0.4, borderWidth: 2, pointRadius: 0
      });
    }
    if (metric === 'all' || metric === 'spo2') {
      datasets.push({
        label: 'SpO2 (%)', data: vitals.map(v => v.spo2),
        borderColor: '#a855f7', backgroundColor: 'rgba(168, 85, 247, 0.1)',
        tension: 0.4, borderWidth: 2, pointRadius: 0
      });
    }
    if (metric === 'all' || metric === 'bp') {
      datasets.push({
        label: 'Sys BP', data: vitals.map(v => v.systolicBP),
        borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)',
        tension: 0.4, borderWidth: 2, pointRadius: 0
      });
      datasets.push({
        label: 'Dia BP', data: vitals.map(v => v.diastolicBP),
        borderColor: '#f97316', backgroundColor: 'rgba(249, 115, 22, 0.1)',
        tension: 0.4, borderWidth: 2, pointRadius: 0
      });
    }
    if (metric === 'temp') {
      datasets.push({
        label: 'Temp (°C)', data: vitals.map(v => v.temperature),
        borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)',
        tension: 0.4, borderWidth: 2, pointRadius: 0
      });
    }

    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top', labels: { font: { family: 'Prompt', size: 11 }, usePointStyle: true, padding: 15 } }
        },
        scales: {
          x: { grid: { color: '#fce7f3' }, ticks: { font: { size: 10 }, maxTicksLimit: 8 } },
          y: { grid: { color: '#fce7f3' }, ticks: { font: { size: 10 } } }
        },
        interaction: { mode: 'index', intersect: false }
      }
    });

    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [vitals, metric]);

  return <canvas ref={canvasRef} />;
};

const HospitalRecommendation = ({ patient, t, lang }) => {
  if (!patient.homeAddress) return null;
  const { lat, lng } = patient.homeAddress;

  const nearestHospitals = useMemo(() => {
    return [...HOSPITALS]
      .map(h => ({ ...h, distance: haversineDistance(lat, lng, h.lat, h.lng) }))
      .sort((a, b) => a.distance - b.distance)
      .slice(0, 3);
  }, [lat, lng]);

  const urgent = patient.status === 'warning' || patient.status === 'critical';
  const typeLabel = (type) => t(`hosp.type.${type}`);
  const typeBadgeColor = (type) =>
    type === 'tertiary' ? 'bg-purple-100 text-purple-700' :

          {t('hosp.urgent')}
        </div>
      )}

      <div className="p-4 space-y-3">
        {nearestHospitals.map((h, idx) => (
          <div key={h.id} className={`rounded-xl border p-3 flex flex-col gap-2 ${idx === 0 ? 'border-sky-200 bg-sky-50' : 'border-gray-100 bg-gray-50'}`}>

              <p className="text-sm text-sky-600 mt-1 flex items-center gap-1">
                <Icons.Home className="w-4 h-4" />
                {patient.homeAddress.street} เขต{patient.homeAddress.district} {patient.homeAddress.province}
              </p>
            )}
          </div>
          <div className={`px-4 py-2 rounded-lg font-semibold text-sm ${
            patient.status === 'stable' ? 'bg-green-100 text-green-700' :
            patient.status === 'warning' ? 'bg-amber-100 text-amber-700' :
            'bg-red-100 text-red-700 animate-pulse'
          }`}>
            {t(`status.${patient.status}`)}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
        {[
          { label: t('patient.heartRate'), value: Math.round(latest.heartRate || 0), unit: 'bpm', icon: Icons.Heart, color: 'text-red-500', bg: 'bg-red-50' },
          { label: t('patient.bp'), value: `${latest.systolicBP || '--'}/${latest.diastolicBP || '--'}`, unit: 'mmHg', icon: Icons.Activity, color: 'text-primary-500', bg: 'bg-primary-50' },
          { label: t('patient.spo2'), value: Math.round(latest.spo2 || 0), unit: '%', icon: Icons.Wind, color: 'text-secondary-500', bg: 'bg-secondary-50' },
          { label: t('patient.temp'), value: latest.temperature || '--', unit: '°C', icon: Icons.Thermometer, color: 'text-orange-500', bg: 'bg-orange-50' }
        ].map(({ label, value, unit, icon: IconC, color, bg }) => (
          <div key={label} className={`${bg} rounded-xl border border-primary-100 p-4`}>
            <div className="flex items-center gap-2 mb-2">
              <IconC className={`w-5 h-5 ${color}`} />
              <span className="text-xs text-gray-600 font-medium">{label}</span>
            </div>
            <p className="text-2xl font-bold text-gray-800">{value}</p>
            <p className="text-xs text-gray-500">{unit}</p>
          </div>
        ))}
      </div>

      <div className="bg-white rounded-xl border border-primary-100 p-4 shadow-sm">
        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
          <h2 className="font-semibold text-gray-800">{t('chart.vital')}</h2>
          <select value={metric} onChange={e => setMetric(e.target.value)}
            className="px-3 py-1.5 border border-primary-200 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-primary-400">
            <option value="all">{t('chart.all')}</option>
            <option value="hr">{t('chart.hr')}</option>
            <option value="bp">{t('chart.bp')}</option>
            <option value="spo2">{t('chart.spo2')}</option>
            <option value="temp">{t('chart.temp')}</option>
          </select>
        </div>
        <div style={{ height: 300 }}>
          <VitalChart vitals={patient.vitals} metric={metric} />
        </div>
      </div>

      {/* In-hospital map */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="bg-white rounded-xl border border-primary-100 overflow-hidden shadow-sm" style={{ height: 400 }}>
          <div className="px-4 py-2 bg-gradient-to-r from-primary-50 to-secondary-50 border-b border-primary-100 flex items-center gap-2">
            <Icons.MapPin className="w-4 h-4 text-primary-600" />
            <span className="font-semibold text-sm">{t('map.location')}</span>
          </div>
          <MapView patients={[patient]} center={[patient.location.lat, patient.location.lng]} zoom={16} />
        </div>

        <div className="space-y-4">
          <div className="bg-white rounded-xl border border-primary-100 p-4 shadow-sm">
            <h3 className="font-semibold text-gray-800 mb-3 flex items-center gap-2">
              <Icons.Shield className="w-4 h-4 text-primary-600" /> {t('med.title')}
            </h3>
            <div className="space-y-2">
              {patient.medications.map((m, i) => (
                <div key={i} className="flex items-center justify-between p-2.5 bg-primary-50 rounded-lg text-sm">
                  <div>
                    <span className="font-medium text-gray-800">{m.name}</span>
                    <span className="text-gray-500 ml-2">{m.dosage}</span>
                  </div>
                  <span className="text-xs text-gray-500 bg-white px-2 py-1 rounded">{m.schedule}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-xl border border-primary-100 p-4 shadow-sm">
            <h3 className="font-semibold text-gray-800 mb-3 flex items-center gap-2">
              <Icons.Clock className="w-4 h-4 text-secondary-600" /> {t('apt.title')}
            </h3>
            <div className="space-y-2">
              {patient.appointments.map((a, i) => (
                <div key={i} className="p-2.5 bg-secondary-50 rounded-lg text-sm">
                  <p className="font-medium text-gray-800">{a.title}</p>
                  <p className="text-xs text-gray-500 mt-1">
                    {new Date(a.datetime).toLocaleString(lang === 'th' ? 'th-TH' : 'en-US', { dateStyle: 'medium', timeStyle: 'short' })}
                  </p>
                  {a.notes && <p className="text-xs text-gray-400 mt-1">{a.notes}</p>}
                </div>
              ))}
              {patient.appointments.length === 0 && <p className="text-sm text-gray-400">{t('apt.none')}</p>}
            </div>
          </div>
        </div>
      </div>

      {/* Home address map + Hospital recommendation */}
      {patient.homeAddress && (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          {/* Home map */}
          <div className="bg-white rounded-xl border border-sky-200 overflow-hidden shadow-sm" style={{ height: 420 }}>
            <div className="px-4 py-2 bg-gradient-to-r from-sky-50 to-cyan-50 border-b border-sky-100 flex items-center gap-2">
              <Icons.Home className="w-4 h-4 text-sky-600" />
              <span className="font-semibold text-sm text-sky-700">{t('home.address')} — เขต{patient.homeAddress.district}</span>
            </div>
            <div className="px-4 py-2 bg-sky-50 border-b border-sky-100 flex flex-wrap gap-3 text-xs text-gray-500">
              <span>🏠 บ้านผู้ป่วย</span>
              <span>🏥 สถานพยาบาลใกล้เคียง (top 3)</span>
            </div>
            <div style={{ height: 345 }}>
              <MapView
                patients={[patient]}
                center={[patient.homeAddress.lat, patient.homeAddress.lng]}
                zoom={13}
                showHomeMarkers={true}
                showHospitalMarkers={true}
                hospitals={nearestHospitals}
              />
            </div>
          </div>

          {/* Hospital recommendation */}
          <HospitalRecommendation patient={patient} t={t} lang={lang} />
        </div>
      )}
    </div>
  );
};

// ============ Alerts Page ============
const AlertsPage = () => {
  const { t } = useApp();
  return (
    <div className="space-y-4 fade-in">
      <h1 className="text-2xl font-bold gradient-text">{t('nav.alerts')}</h1>
      <AlertPanel />
    </div>
  );
};

// ============ Settings ============
const Settings = () => {
  const { t, lang, changeLang, user, addToast } = useApp();
  const [notify, setNotify] = useState({ sms: true, line: true, push: true });

  const testNotify = (channel) => {
    const msgs = { sms: t('toast.sms'), line: t('toast.line'), push: t('toast.push') };
    addToast(`✅ ${msgs[channel]} - Test`, 'info');
  };

  return (
    <div className="max-w-2xl space-y-4 fade-in">
      <h1 className="text-2xl font-bold gradient-text">{t('nav.settings')}</h1>

      <div className="bg-white rounded-xl border border-primary-100 p-5 shadow-sm">
        <div className="flex items-center gap-3 mb-4">
          <Icons.Globe className="w-5 h-5 text-primary-600" />
          <h2 className="font-semibold text-gray-800">{t('settings.lang')}</h2>
        </div>
        <div className="flex gap-2">
          <button onClick={() => changeLang('th')}
            className={`px-4 py-2 rounded-lg font-medium transition ${lang === 'th' ? 'bg-gradient-to-r from-primary-500 to-secondary-500 text-white shadow-md' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
            🇹🇭 ไทย
          </button>
          <button onClick={() => changeLang('en')}
            className={`px-4 py-2 rounded-lg font-medium transition ${lang === 'en' ? 'bg-gradient-to-r from-primary-500 to-secondary-500 text-white shadow-md' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
            🇬🇧 English
          </button>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-primary-100 p-5 shadow-sm">
        <div className="flex items-center gap-3 mb-4">
          <Icons.Bell className="w-5 h-5 text-primary-600" />
          <h2 className="font-semibold text-gray-800">{t('settings.notif')}</h2>
        </div>
        <div className="space-y-3">
          {[
            { key: 'sms', label: 'SMS (Twilio)', icon: '📱' },
            { key: 'line', label: 'LINE Notify', icon: '💬' },
            { key: 'push', label: 'Push Notification', icon: '🔔' }
          ].map(({ key, label, icon }) => (
            <div key={key} className="flex items-center justify-between p-3 bg-gradient-to-r from-primary-50 to-secondary-50 rounded-lg">
              <span className="font-medium text-sm flex items-center gap-2">
                <span>{icon}</span> {label}
              </span>
              <div className="flex items-center gap-2">
                <button onClick={() => testNotify(key)}
                  className="text-xs px-2 py-1 bg-white border border-primary-200 rounded hover:bg-primary-50 text-primary-700">
                  Test
                </button>
                <input type="checkbox" checked={notify[key]}
                  onChange={e => setNotify({ ...notify, [key]: e.target.checked })}
                  className="w-5 h-5 accent-primary-500" />
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="bg-white rounded-xl border border-primary-100 p-5 shadow-sm">
        <div className="flex items-center gap-3 mb-4">
          <Icons.Shield className="w-5 h-5 text-primary-600" />
          <h2 className="font-semibold text-gray-800">{t('settings.account')}</h2>
        </div>
        <div className="space-y-2 text-sm">
          <div className="flex justify-between py-2 border-b border-gray-100">
            <span className="text-gray-500">Name</span>
            <span className="font-medium text-gray-800">{user?.name}</span>
          </div>
          <div className="flex justify-between py-2 border-b border-gray-100">
            <span className="text-gray-500">Email</span>
            <span className="font-medium text-gray-800">{user?.email}</span>
          </div>
          <div className="flex justify-between py-2">
            <span className="text-gray-500">Role</span>
            <span className="font-medium capitalize text-gray-800">{user?.role}</span>
          </div>
        </div>
      </div>

      {/* Hospital list reference */}
      <div className="bg-white rounded-xl border border-sky-200 p-5 shadow-sm">
        <div className="flex items-center gap-3 mb-4">
          <span className="text-xl">🏥</span>
          <h2 className="font-semibold text-gray-800">สถานพยาบาลในระบบ ({HOSPITALS.length} แห่ง)</h2>
        </div>
        <div className="space-y-2 max-h-64 overflow-y-auto scrollbar-thin">
          {HOSPITALS.map(h => (
            <div key={h.id} className="flex items-center justify-between text-sm py-1.5 border-b border-gray-50">
              <div>
                <span className="font-medium text-gray-800">{h.name}</span>
                <span className="text-xs text-gray-400 ml-2">{h.specialty}</span>
              </div>
              <a href={`tel:${h.phone}`} className="text-xs text-sky-600 hover:underline">{h.phone}</a>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ============ Main App ============
const App = () => {
  const { user, page } = useApp();

  if (!user) return <Login />;

  const renderPage = () => {
    switch (page) {
      case 'dashboard': return <Dashboard />;
      case 'patients': return <PatientList />;
      case 'patient-detail': return <PatientDetail />;
      case 'alerts': return <AlertsPage />;
      case 'settings': return <Settings />;
      default: return <Dashboard />;
    }
  };

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar />
      <div className="flex flex-1 flex-col overflow-hidden">
        <Header />
        <main className="flex-1 overflow-y-auto scrollbar-thin p-4 md:p-6">
          {renderPage()}
        </main>
      </div>
      <Toast />
    </div>
  );
};

// ============ Mount ============
ReactDOM.createRoot(document.getElementById('root')).render(
  <AppProvider>
    <App />
  </AppProvider>
);
</script>
</body>
</html>
